<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>%%TITLE%%</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* The edition as a document for an 11-inch e-reader (3:4). Colour is left wherever the sources carry it. */
@page{size:6.6in 8.8in;margin:.6in .56in .68in .56in;@bottom-center{content:counter(page);font-family:system-ui,sans-serif;font-size:7.5pt;color:#555}}
@page:first{@bottom-center{content:''}}
html{font-size:10.4pt}body{margin:0;font-family:"Literata",Georgia,serif;line-height:1.46;color:#111}
a{color:inherit;text-decoration:none}
/* Page 1: the heading and the day in two minutes, then the Contents; then one continuous flow */
.toc{break-before:page}.today{break-before:auto}.mast{margin:0 0 1.2em}.masth{font-size:2.6em;line-height:1.05;letter-spacing:-.02em;margin:0}.mastline{font-family:system-ui,sans-serif;font-size:.7em;color:#555;margin-top:.35em}
.toch{font-size:1.6em;margin:0 0 .5em;letter-spacing:-.01em}
.fgrp{font-family:system-ui,sans-serif;font-size:.6em;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#555;border-bottom:.5pt solid #999;padding-bottom:.2em;margin:1.3em 0 .5em;break-after:avoid}
.fitem{margin:0 0 .6em;line-height:1.32;text-align:left;hyphens:manual;break-inside:avoid}.fitem a{font-weight:600}
.fwhy{font-style:italic}.fsrc{font-family:system-ui,sans-serif;font-size:.62em;color:#555;margin-left:.3em;white-space:nowrap}
.tsec{display:flex;justify-content:space-between;align-items:baseline;font-size:1.05em;font-weight:800;color:#111;border-bottom:1.5pt solid #111;padding:1.3em 0 .3em;break-after:avoid}
.tcount{font-family:system-ui,sans-serif;font-size:.6em;font-weight:400;color:#555}.titem{display:block;padding:.16em 0 .16em 1em;line-height:1.25;break-inside:avoid}.titem .tt{font-weight:600;font-size:.9em}.titem .tm{display:inline;margin:0}
.tm{display:block;font-family:system-ui,sans-serif;font-size:.64em;color:#555;margin-top:.15em}.left{font-size:.76em;font-style:italic;color:#555;margin-top:1.4em}
.kicker,.minih{font-family:system-ui,sans-serif;font-size:.62em;letter-spacing:.18em;text-transform:uppercase;color:#555;display:block}
.sec{margin-top:2em;border-top:3pt solid #111;padding-top:.4em;break-after:avoid}.sech{font-size:2.5em;line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0 0 .1em}.secm{font-size:.84em;font-style:italic;color:#555}
.rule{width:2.4em;border-top:1.5px solid #111;margin:.9em 0 1em}
.secnav,.endnav{display:flex;flex-wrap:wrap;gap:.4em 1.4em;justify-content:space-between;font-family:system-ui,sans-serif;font-size:.66em;color:#555;margin-top:1.1em}
article h1{font-size:1.7em;line-height:1.14;letter-spacing:-.012em;margin:.35em 0 .4em;text-wrap:balance}.by{font-size:.8em;color:#555}
.mini{margin:0 0 1em;padding:.5em 0;border-top:.4pt solid #bbb;border-bottom:.4pt solid #bbb}.mini a{display:block;font-size:.82em;line-height:1.3;padding:.16em 0}
.body p{margin:0 0 .6em;text-align:justify;hyphens:auto;orphans:3;widows:3;overflow-wrap:anywhere}
.body h2{font-size:1.14em;line-height:1.22;margin:1.2em 0 .35em;break-after:avoid}.body h2 .up{display:none}.body h3{font-size:1em;font-style:italic;font-weight:400;margin:1em 0 .3em;break-after:avoid}
.body figure{margin:.9em 0;break-inside:avoid;text-align:center}.body img{max-width:100%;max-height:3.9in}
.body blockquote{margin:.8em 0;padding-left:.8em;border-left:1.2pt solid #777;font-size:.95em}.body ul,.body ol{padding-left:1.2em;margin:.2em 0 .7em}.body li{margin:.15em 0}
.body a{border-bottom:.4pt dotted #888}.body hr{border:0;border-top:.5pt solid #999;margin:1.1em 30%}
.body p.src{font-family:system-ui,sans-serif;font-size:.64em;color:#555;text-align:left;margin:-.2em 0 .5em}.body p.why{font-style:italic;text-align:left}.body p.tldr{font-style:italic;text-align:left;hyphens:manual;margin-bottom:.8em}.body p.tldr .tl{font-style:normal;font-family:system-ui,sans-serif;font-size:.7em;letter-spacing:.04em;color:#555}
.body .jd p{font-size:.88em;text-align:left;color:#222}.body .jd p.trunc{font-family:system-ui,sans-serif;font-size:.64em;color:#555}
.body p.job{text-align:left;margin-bottom:.5em;break-inside:avoid;line-height:1.26;font-size:.92em}.body p.job b{font-family:system-ui,sans-serif;font-size:.8em;margin-right:.3em}
.body p.job span:not(.sc){display:block;font-size:.84em;line-height:1.36;color:#333;margin-top:.15em}
.sc{font-family:system-ui,sans-serif;font-size:.78em;font-weight:700;color:#fff;border-radius:.28em;padding:.08em .42em;margin-right:.25em;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sc.hi{background:#12733a}.sc.mid{background:#b86400}.sc.lo{background:#6b6862}
.body h2 .sc{font-size:.72em;vertical-align:.12em}.body h2.xsub{font-family:system-ui,sans-serif;font-size:.78em;font-weight:600;letter-spacing:.03em;color:#555;margin:1.4em 0 .5em}.body h2.xsub:first-child{margin-top:0}
/* Repository sections: index and five cards on one page; the piece's own heading repeats the section's, so it is left out */
article.compact{break-before:auto;margin-top:1em}article.compact>.kicker,article.compact>h1,article.compact>.by,article.compact>.rule,article.compact>.end{display:none}
.body .card{break-inside:avoid}.body .card+.card{margin-top:.8em}
.body .card p.badge{float:left;margin:.16em .5em 0 0;line-height:1.1;font-size:.86em}.body .card h2{margin:0 0 .18em;line-height:1.22;font-size:1em}.body .card h2 a{border-bottom:0}
.body .card p.why{margin:0 0 .18em;line-height:1.34;font-size:.84em}.body .card p.src{margin:0;clear:left;font-size:.6em}
.sc.x{background:#111}
/* List sections (repositories): one row per item, the coloured marker, the linked name, a one-line brief */
.body p.job a{border-bottom:0;font-weight:600}.body p.job b.gain{font-family:system-ui,sans-serif;font-size:.68em;font-weight:400;color:#555;margin-left:.4em}
article.compact.sub>h1{display:block;font-size:1.08em;margin:.2em 0 .5em}article.compact.sub{margin-top:1.4em}
/* Brief feeds: half a page each, two to a page; every row is two lines at most (name, brief), cut with an ellipsis */
article.compact+.sec.brief{break-before:auto;margin-top:1.8em}.sec.brief{break-inside:avoid;break-after:avoid}.sec.brief .seck,.sec.brief .sech{break-after:avoid}.body p.job,.body p.job span:not(.sc){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The Sunday digest: one plain paragraph per piece or market move */
.body p.post{margin:0 0 .25em;font-size:.92em;line-height:1.36;text-align:left;hyphens:manual}.body p.follow{margin:0 0 .4em;font-size:.86em;line-height:1.36;text-align:left;hyphens:manual}.body p.follow a{border-bottom:0}
.end{text-align:center;font-size:.7em;margin-top:1.3em;color:#555}
</style>
</head>
<body>%%BOOK%%</body>
</html>
